spring:
  application:
    name: huifu-starchain
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # MySQL 数据源
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:huifu_starchain}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: HuifuHikariCP

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          fetch_size: 100

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history
    encoding: UTF-8

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # 文件上传
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

# 服务端口
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000
    keep-alive-timeout: 60s

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: huifu-starchain
  region: cn-east-1

# JWT
jwt:
  secret: ${JWT_SECRET:huifu-starchain-jwt-secret-key-2026-at-least-256-bits}
  access-token-expiration: 7200   # 2 hours
  refresh-token-expiration: 604800 # 7 days
  issuer: huifu-starchain

# 加密
crypto:
  aes-key: ${AES_KEY:huifu-starchain-aes-key-256bit!!}

# 医院网关
hospital:
  gateway:
    base-url: ${HOSPITAL_GATEWAY_URL:http://10.0.0.100:8081}
    api-key: ${HOSPITAL_API_KEY:}
    timeout: 30s
    retry-max: 3

# 微信小程序
wechat:
  miniprogram:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}

# 企业微信
wecom:
  corp-id: ${WECOM_CORP_ID:}
  corp-secret: ${WECOM_CORP_SECRET:}
  agent-id: ${WECOM_AGENT_ID:}

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# 日志
logging:
  level:
    root: INFO
    com.huifu.starchain: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n'
  file:
    name: /var/log/huifu-starchain/application.log
    max-size: 100MB
    max-history: 30
