version: '3.8'

# ============================================================
# 惠福星链 · Huifu StarChain — Docker Compose
# 生产环境部署配置
# ============================================================

services:
  # ---------------------------------------------------------
  # Nginx 反向代理
  # ---------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: huifu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend-dist:/usr/share/nginx/html:ro
    networks:
      - huifu-net
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------
  # Spring Boot API
  # ---------------------------------------------------------
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: huifu-starchain-api:${APP_VERSION:-latest}
    container_name: huifu-api
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=huifu_starchain
      - MYSQL_USER=huifu
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AES_KEY=${AES_KEY}
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      - WECOM_CORP_ID=${WECOM_CORP_ID}
      - WECOM_CORP_SECRET=${WECOM_CORP_SECRET}
      - HOSPITAL_GATEWAY_URL=${HOSPITAL_GATEWAY_URL}
      - HOSPITAL_API_KEY=${HOSPITAL_API_KEY}
    volumes:
      - /var/log/huifu-starchain:/var/log/huifu-starchain
    networks:
      - huifu-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------
  # MySQL 8.0 Community Edition
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: huifu-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=huifu_starchain
      - MYSQL_USER=huifu
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    networks:
      - huifu-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # ---------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: huifu-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - huifu-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---------------------------------------------------------
  # MinIO 对象存储
  # ---------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: huifu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - huifu-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

# -----------------------------------------------------------
# Volumes
# -----------------------------------------------------------
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  frontend-dist:
    driver: local

# -----------------------------------------------------------
# Networks
# -----------------------------------------------------------
networks:
  huifu-net:
    driver: bridge
